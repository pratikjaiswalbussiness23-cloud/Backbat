[project]
name = "nlbt"
version = "0.1.0"
description = "Natural-language trading strategy backtester: English -> validated JSON spec -> deterministic backtest engine -> metrics. The LLM only translates; it never computes numbers or runs code."
readme = "README.md"
requires-python = ">=3.14"          # ADR-0001: verified by installing all planned deps from wheels
license = { text = "Proprietary" }  # ADR-0001: revisit before any release (Appendix G #2)
authors = [{ name = "Owner" }]
dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "pyarrow>=25,<26",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "typer>=0.15,<1",
    "yfinance>=1.7,<2",  # P1-T3: yfinance provider (see OQ-0006, DEPENDENCIES.md)
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pre-commit>=4",
    "pandas-stubs>=2.2,<3",  # mypy strict: pandas has no bundled stubs (OQ-0004)
]

[tool.uv]
# OneDrive-synced folders break uv's hardlink cache strategy (os error 396).
link-mode = "copy"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q --strict-markers --strict-config -m "not network and not llm_live"'
markers = [
    "unit: pure unit test, no network/LLM (P1-T3 convention; see OQ-0007)",
    "lookahead: no-lookahead defence tests (ROADMAP §4.5, P4-T10)",
    "slow: long-running tests, run nightly",
    "network: tests hitting real data providers; DESELECTED by default (P0-T2)",
    "llm_live: tests making real LLM calls; DESELECTED by default (P0-T2)",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# yfinance 1.7.0 ships no py.typed / stubs (verified); targeted override instead
# of blanket per-line ignores.
module = "yfinance"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["nlbt"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
